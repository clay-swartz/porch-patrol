<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Porch Patrol — Draft Preview</title>
<style>
  :root{--navy:#183447;--teal:#0b6a64;--yellow:#f5c64e;--paper:#fbfaf6;--line:#ded8ce}
  *{box-sizing:border-box}
  body{margin:0;background:#ece8e0;font-family:system-ui,-apple-system,sans-serif;color:var(--navy)}
  .bar{
    position:sticky;top:0;z-index:10;min-height:58px;
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    padding:9px 14px;border-bottom:1px solid var(--line);background:rgba(251,250,246,.96);
    backdrop-filter:blur(10px)
  }
  .title{display:flex;align-items:center;gap:10px;font-weight:800;font-size:12px}
  .badge{padding:6px 8px;border-radius:999px;background:var(--yellow);font-size:9px;letter-spacing:.08em}
  .devices{display:flex;gap:5px}
  .devices button,.close{
    min-height:34px;padding:0 11px;border:1px solid #d5cec3;border-radius:8px;background:#fff;color:var(--navy);font-weight:750;font-size:11px;cursor:pointer
  }
  .devices button.active{background:var(--navy);border-color:var(--navy);color:#fff}
  .stage{min-height:calc(100vh - 58px);padding:18px;display:flex;justify-content:center;align-items:flex-start}
  .frame-wrap{width:100%;max-width:100%;transition:width .18s ease}
  .frame-wrap.tablet{width:820px}
  .frame-wrap.mobile{width:390px}
  iframe{display:block;width:100%;height:calc(100vh - 96px);border:0;border-radius:12px;background:#fff;box-shadow:0 18px 45px rgba(24,52,71,.14)}
  @media(max-width:650px){
    .bar{align-items:flex-start;flex-direction:column}
    .devices{width:100%}.devices button{flex:1}
    .close{position:absolute;right:12px;top:10px}
    .stage{padding:10px}
    iframe{height:calc(100vh - 122px)}
  }
</style>
</head>
<body>
  <header class="bar">
    <div class="title"><span class="badge">DRAFT</span><span>Preview</span></div>
    <div class="devices" aria-label="Preview size">
      <button type="button" data-device="desktop" class="active">Desktop</button>
      <button type="button" data-device="tablet">Tablet</button>
      <button type="button" data-device="mobile">Mobile</button>
    </div>
    <button class="close" type="button" id="close-preview">Close</button>
  </header>
  <main class="stage">
    <div class="frame-wrap" id="frame-wrap">
      <iframe id="preview-frame" title="Porch Patrol draft preview" src="/admin/preview-frame.html"></iframe>
    </div>
  </main>
  <script type="module" src="/admin/preview.js"></script>
</body>
</html>

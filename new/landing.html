<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Porch Patrol is opening new neighborhood routes for simple recurring home upkeep.">
<meta name="theme-color" content="#00645f">
<meta name="robots" content="noindex,nofollow">
<title>Porch Patrol</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,650;9..144,700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0,0&display=swap" rel="stylesheet">

<style>
:root{
  --navy:#102438;
  --teal:#00645f;
  --orange:#d94709;
  --yellow:#ffb600;
  --ink:#253037;
  --muted:#6b7375;
  --paper:#fbfaf6;
  --cream:#f4f0e8;
  --line:#ded8ce;
  --display:"Fraunces",Georgia,serif;
  --sans:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{min-height:100%;background:var(--paper)}
body{min-height:100vh;margin:0;font-family:var(--sans);color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
.page{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(90deg,#fbfaf6 0%,#fbfaf6 58%,#f7f3eb 100%)}
.site-header{height:76px;background:var(--teal);color:#fff;display:flex;align-items:center}
.header-inner{width:min(1180px,calc(100% - 40px));margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
.wordmark{display:inline-flex;align-items:baseline;gap:.20em;font-family:var(--display);font-size:31px;line-height:1;letter-spacing:-.045em;font-weight:650;color:#fff;white-space:nowrap}
.wordmark span{color:var(--yellow)}
.location-label{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e5f2ef}
.hero{flex:1;display:flex;align-items:center;padding:54px 0 58px}
.hero-inner{width:min(1180px,calc(100% - 40px));margin:0 auto;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(390px,.82fr);gap:72px;align-items:center}
.hero-copy{min-width:0}
.personal-pill{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:0 13px;margin-bottom:22px;border-radius:999px;background:#fff0d8;color:#744700;font-size:13px;font-weight:700;border:1px solid rgba(217,71,9,.08)}
.personal-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange)}
.hero h1{max-width:650px;margin:0;font-family:var(--display);font-size:clamp(58px,5.8vw,84px);line-height:.95;letter-spacing:-.04em;font-weight:700;color:var(--navy)}
.lead-form{max-width:700px;margin-top:34px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.86fr) auto;gap:10px}
.field{width:100%;height:54px;border:1px solid #cfc8bd;border-radius:8px;padding:0 14px;background:#fff;color:var(--ink);outline:none}
.field:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,100,95,.10)}
.button{appearance:none;height:54px;padding:0 21px;border:0;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;transition:transform .15s ease,background .15s ease}
.button:hover{transform:translateY(-1px);background:var(--teal)}
.button:focus-visible{outline:3px solid rgba(255,182,0,.45);outline-offset:3px}
.button:disabled{opacity:.65;cursor:wait;transform:none}
.form-note,.form-success,.form-error{margin-top:10px;font-size:12px;color:var(--muted)}
.form-success{display:none;color:#236548;font-weight:700}
.form-error{display:none;color:#9a4339;font-weight:700}

.check-card{overflow:hidden;border:1px solid var(--line);border-radius:18px;background:var(--cream);box-shadow:0 18px 44px rgba(16,36,56,.10)}
.check-card-head{position:relative;isolation:isolate;overflow:hidden;min-height:96px;padding:25px 27px;display:flex;align-items:center;background:linear-gradient(180deg,#102438 0%,#0f2a41 100%);color:#fff}
.check-card-head h2{position:relative;z-index:2;max-width:330px;margin:0;font-family:var(--display);font-size:27px;line-height:1.02;letter-spacing:-.025em;font-weight:700}
.card-pattern{position:absolute;inset:0;z-index:1;width:100%;height:100%;pointer-events:none;opacity:.10}
.check-card[data-pattern-strength="none"] .card-pattern{display:none}
.check-card[data-pattern-strength="subtle"] .card-pattern{opacity:.08}
.check-card[data-pattern-strength="standard"] .card-pattern{opacity:.14}
.check-card[data-pattern-strength="bold"] .card-pattern{opacity:.20}
.card-pattern text{font-family:"Material Symbols Rounded";font-feature-settings:"liga";font-variation-settings:"FILL" 0,"wght" 500,"GRAD" 0,"opsz" 24;fill:#5f7386}
.task-list{padding:14px 27px 20px;display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
.task{min-width:0;display:flex;align-items:center;gap:11px;padding:14px 0;border-bottom:1px solid rgba(16,36,56,.13);font-size:15px;color:#20384b;transition:color .28s ease}
.task:nth-last-child(-n+2){border-bottom:0}
.task-box{width:20px;height:20px;flex:0 0 auto;display:grid;place-items:center;border:1.5px solid #a7afa9;border-radius:5px;background:rgba(255,255,255,.25);transition:.28s ease}
.task-check{width:10px;height:6px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) scale(0);transition:transform .2s ease}
.task-label{position:relative;display:inline-block;white-space:nowrap}
.task-label::after{content:"";position:absolute;left:0;top:53%;width:0;height:1.5px;background:#929894;transition:width .42s ease}
.task.done{color:#8c928d}
.task.done .task-box{background:var(--teal);border-color:var(--teal)}
.task.done .task-check{transform:rotate(-45deg) scale(1)}
.task.done .task-label::after{width:100%}

@media(max-width:900px){
  .hero{padding:52px 0}
  .hero-inner{grid-template-columns:1fr;gap:38px}
  .hero-copy{max-width:690px}
  .check-card{max-width:650px}
}
@media(max-width:620px){
  .header-inner,.hero-inner{width:min(100% - 28px,1180px)}
  .site-header{height:68px}
  .wordmark{font-size:26px}
  .location-label{font-size:9px;letter-spacing:.09em;text-align:right}
  .hero{padding:42px 0}
  .hero h1{font-size:54px}
  .lead-form{grid-template-columns:1fr}
  .button{width:100%}
  .task-list{grid-template-columns:1fr;padding:12px 21px 17px}
  .task:nth-last-child(-n+2){border-bottom:1px solid rgba(16,36,56,.13)}
  .task:last-child{border-bottom:0}
  .check-card-head{padding:22px 21px}
  .check-card-head h2{font-size:27px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="page">
  <header class="site-header">
    <div class="header-inner">
      <div class="wordmark">Porch <span>Patrol</span></div>
      <div class="location-label" id="location-label">Coming to East Dallas</div>
    </div>
  </header>

  <main class="hero">
    <div class="hero-inner">
      <section class="hero-copy">
        <div class="personal-pill" id="personal-pill">Hey, Nick.</div>
        <h1 id="landing-headline">Your house is about to get some backup.</h1>

        <form class="lead-form" id="landing-lead-form">
          <input type="hidden" name="Name" id="lead-name" value="Nick">
          <input type="hidden" name="Plan" id="lead-plan" value="Custom Landing Page">
          <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none">

          <input class="field" id="address-field" type="text" name="Home Address" placeholder="Home address" aria-label="Home address" autocomplete="street-address" required>
          <input class="field" id="mobile-field" type="tel" name="Mobile" placeholder="Mobile number" aria-label="Mobile number" autocomplete="tel" inputmode="tel" required>
          <button class="button" id="submit-button" type="submit">Add my house</button>
        </form>

        <div class="form-note" id="form-note">We’ll text you with the details.</div>
        <div class="form-success" id="form-success" role="status" aria-live="polite"></div>
        <div class="form-error" id="form-error" role="alert" aria-live="assertive">Something didn’t send. Please try again.</div>
      </section>

      <section class="check-card" id="check-card" data-pattern-strength="subtle" aria-label="Examples of things Porch Patrol handles">
        <div class="check-card-head">
          <svg class="card-pattern" aria-hidden="true" preserveAspectRatio="none">
            <defs>
              <pattern id="porchPatrolLandingPattern" width="144" height="96" patternUnits="userSpaceOnUse">
                <text x="20" y="28" font-size="22">home</text>
                <text x="68" y="28" font-size="22">build</text>
                <text x="116" y="28" font-size="22">lightbulb</text>
                <text x="20" y="76" font-size="22">cleaning_services</text>
                <text x="68" y="76" font-size="22">potted_plant</text>
                <text x="116" y="76" font-size="22">search</text>
              </pattern>
            </defs>
            <rect width="100%" height="100%" fill="url(#porchPatrolLandingPattern)"></rect>
          </svg>
          <h2 id="list-headline">Let us handle the little things.</h2>
        </div>
        <div class="task-list" id="task-list">
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Bulbs</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Cobwebs</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Loose hardware</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Weeds</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Mats + furniture</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Drips</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Quick fixes</span></div>
            <div class="task"><span class="task-box" aria-hidden="true"><span class="task-check"></span></span><span class="task-label">Small upkeep</span></div>
          </div>
      </section>
    </div>
  </main>
</div>

<script type="module">
const SUPABASE_URL = "https://uymwsivcgtapckzjoywk.supabase.co";
const SUPABASE_KEY = "sb_publishable_Zv_J_fCv2wTC-qlsV3h_Mg_i7nkJPZG";
const LEAD_ENDPOINT = SUPABASE_URL + "/functions/v1/submit-porch-patrol-lead";

const slug = location.pathname.split("/").filter(Boolean).join("/");
const fallback = slug === "new/nick" ? {
  type:"customLandingPage",
  title:"Porch Patrol — East Dallas",
  firstName:"Nick",
  locationLabel:"Coming to East Dallas",
  headline:"Your house is about to get some backup.",
  listHeadline:"Let us handle the little things.",
  items:["Bulbs","Cobwebs","Loose hardware","Weeds","Mats + furniture","Drips","Quick fixes","Small upkeep"],
  form:{
    addressPlaceholder:"Home address",
    mobilePlaceholder:"Mobile number",
    submitLabel:"Add my house",
    note:"We’ll text you with the details.",
    successMessage:"Got it. We’ll text you with the details."
  },
  visual:{patternStrength:"subtle"}
} : {
  type:"customLandingPage",
  title:"Porch Patrol",
  firstName:"Neighbor",
  locationLabel:"Coming soon",
  headline:"Your house is about to get some backup.",
  listHeadline:"Let us handle the little things.",
  items:["Bulbs","Cobwebs","Loose hardware","Weeds","Mats + furniture","Drips","Quick fixes","Small upkeep"],
  form:{
    addressPlaceholder:"Home address",
    mobilePlaceholder:"Mobile number",
    submitLabel:"Add my house",
    note:"We’ll text you with the details.",
    successMessage:"Got it. We’ll text you with the details."
  },
  visual:{patternStrength:"subtle"}
};

function safeContent(candidate){
  return candidate && candidate.type === "customLandingPage" ? candidate : fallback;
}

async function loadContent(){
  const params = new URLSearchParams(location.search);
  if(params.get("preview") === "1"){
    try{
      const preview = JSON.parse(localStorage.getItem("porchPatrolLandingPreview") || "null");
      if(preview && preview.slug === slug && preview.content) return safeContent(preview.content);
    }catch{}
  }

  try{
    const response = await fetch(SUPABASE_URL + "/rest/v1/rpc/get_porch_patrol_published_landing_page",{
      method:"POST",
      headers:{
        apikey:SUPABASE_KEY,
        "Content-Type":"application/json",
        Accept:"application/json"
      },
      body:JSON.stringify({p_slug:slug}),
      cache:"no-store"
    });
    if(!response.ok) throw new Error("Landing content request failed");
    const content = await response.json();
    return safeContent(content);
  }catch(error){
    console.warn("[Porch Patrol] Landing page CMS unavailable; using static fallback.", error);
    return fallback;
  }
}

let checklistTimer = null;

function renderChecklist(items){
  const list = document.getElementById("task-list");
  list.replaceChildren();

  (items || []).slice(0,16).forEach((label)=>{
    const row = document.createElement("div");
    row.className = "task";

    const box = document.createElement("span");
    box.className = "task-box";
    box.setAttribute("aria-hidden","true");

    const check = document.createElement("span");
    check.className = "task-check";
    box.appendChild(check);

    const text = document.createElement("span");
    text.className = "task-label";
    text.textContent = label;

    row.append(box,text);
    list.appendChild(row);
  });
}

function startChecklist(){
  if(checklistTimer) clearInterval(checklistTimer);
  const items = [...document.querySelectorAll("#task-list .task")];

  if(!items.length) return;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches){
    items.forEach(item=>item.classList.add("done"));
    return;
  }

  const run = ()=>{
    items.forEach(item=>item.classList.remove("done"));
    let index = 0;
    checklistTimer = setInterval(()=>{
      items[index].classList.add("done");
      index += 1;
      if(index >= items.length){
        clearInterval(checklistTimer);
        checklistTimer = null;
        setTimeout(run,1700);
      }
    },520);
  };

  run();
}

function render(content){
  document.title = content.title || "Porch Patrol";
  document.getElementById("location-label").textContent = content.locationLabel || "";
  document.getElementById("personal-pill").textContent = "Hey, " + (content.firstName || "there") + ".";
  document.getElementById("landing-headline").textContent = content.headline || "";
  document.getElementById("list-headline").textContent = content.listHeadline || "";
  document.getElementById("address-field").placeholder = content.form?.addressPlaceholder || "Home address";
  document.getElementById("mobile-field").placeholder = content.form?.mobilePlaceholder || "Mobile number";
  document.getElementById("submit-button").textContent = content.form?.submitLabel || "Add my house";
  document.getElementById("form-note").textContent = content.form?.note || "";
  document.getElementById("lead-name").value = content.firstName || "Landing page lead";
  document.getElementById("lead-plan").value = "Custom Landing Page — " + slug;
  document.getElementById("check-card").dataset.patternStrength = content.visual?.patternStrength || "subtle";
  renderChecklist(content.items || []);
  startChecklist();
}

let content = fallback;
loadContent().then((loaded)=>{
  content = loaded;
  render(content);
}).catch((error)=>{
  console.warn("[Porch Patrol] Landing page load failed; using fallback.", error);
  render(fallback);
});

document.getElementById("landing-lead-form").addEventListener("submit",async(event)=>{
  event.preventDefault();

  const form = event.currentTarget;
  const submit = document.getElementById("submit-button");
  const success = document.getElementById("form-success");
  const error = document.getElementById("form-error");
  const original = submit.textContent;
  const data = new FormData(form);

  success.style.display = "none";
  error.style.display = "none";
  submit.disabled = true;
  submit.textContent = "Sending…";

  const payload = {
    name:String(data.get("Name") || "").trim(),
    home_address:String(data.get("Home Address") || "").trim(),
    mobile:String(data.get("Mobile") || "").trim(),
    plan:String(data.get("Plan") || "").trim(),
    _honey:String(data.get("_honey") || "")
  };

  try{
    const response = await fetch(LEAD_ENDPOINT,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
    if(!response.ok) throw new Error("Lead submission failed");

    const recipient = [99,108,97,121,116,111,110,46,115,119,97,114,116,122,64,103,109,97,105,108,46,99,111,109]
      .map((c)=>String.fromCharCode(c)).join("");

    fetch("https://formsubmit.co/ajax/" + recipient,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({
        _subject:"New Porch Patrol custom landing page lead",
        _template:"table",
        Name:payload.name,
        "Home Address":payload.home_address,
        Mobile:payload.mobile,
        Page:slug
      })
    }).catch(()=>{});

    document.getElementById("address-field").value = "";
    document.getElementById("mobile-field").value = "";
    success.textContent = content.form?.successMessage || "Got it. We’ll text you with the details.";
    success.style.display = "block";
  }catch(err){
    console.error(err);
    error.style.display = "block";
  }finally{
    submit.disabled = false;
    submit.textContent = original;
  }
});
</script>
</body>
</html>
